name: MicroGen offline regressions

# Offline unit tests only: least-privilege checkout, no write access.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv google-genai google-cloud-texttospeech PyPDF2 pymupdf pillow imageio-ffmpeg pytest
      - name: Static syntax check
        run: |
          python -m compileall -q microgen_batch.py microgen_quality.py microgen_narration_batch.py microgen_lesson_plan.py microgen_doctor.py microgen_multipart.py microgen_ownership.py microgen_scene_proposal.py microgen_docling_environment.py gen_script_v13.py gen_slides_v20.py text_to_speech_v25.py gen_video_v22.py microgen_legacy_audio_demux.py microgen_audio_tail_video_candidate.py microgen_section25_pronunciation_review.py microgen_offline_pronunciation_contrast.py microgen_offline_vosk_capture.py microgen_offline_asr_pdf_highlight.py microgen_offline_highlight_pixel_qa.py microgen_full17_provisional_cues.py microgen_full17_render.py microgen_full17_pcm_mux.py microgen_full17_pixel_acceptance.py microgen_section25_completion_cli.py microgen_section25_distribution_qa.py microgen_legacy_defect_map.py microgen_correction_selection.py microgen_shadow_pcm.py microgen_shadow_audio_diagnostics.py microgen_equation_geometry.py microgen_figure_geometry_inventory.py microgen_acoustic_math_anchors.py microgen_figure_pixel_evidence.py microgen_independent_review_packet.py microgen_final_evidence_gate.py microgen_audio_cue_binding.py microgen_corrected_cue_realign.py microgen_corrected_audio_stage.py microgen_section25_real_recovery.py microgen_corrected_shadow_video.py microgen_corrected_slide_clock.py microgen_corrected_slide_pixel_audit.py microgen_corrected_listening_packet.py microgen_corrected_release_gate.py microgen_local_vosk_model_verify.py microgen_resumable_corrected_asr.py microgen_corrected_word_video.py microgen_corrected_word_pixel_qa.py microgen_corrected_semantic_review.py microgen_corrected_release_gate_v2.py microgen_figure_composition.py map_and_rename_v5.py microgen_slide_reflow.py
      - name: Unit tests (no API calls)
        run: python -m unittest discover -s tests -v
      - name: Isolated element-highlight evidence contract tests
        run: python -m pytest -q tests/test_microgen_tts_highlight_evidence.py tests/test_microgen_tts_av_evidence.py tests/test_microgen_tts_pronunciation_groundtruth.py tests/test_microgen_production_bridge.py tests/test_microgen_pipeline_completion.py tests/test_microgen_source_safe_orchestrator.py tests/test_microgen_legacy_audio_demux.py tests/test_microgen_audio_tail_video_candidate.py tests/test_microgen_section25_pronunciation_review.py tests/test_microgen_offline_pronunciation_contrast.py tests/test_microgen_offline_vosk_capture.py tests/test_microgen_offline_asr_pdf_highlight.py tests/test_microgen_offline_highlight_pixel_qa.py tests/test_microgen_full17_provisional_cues.py tests/test_microgen_full17_render.py tests/test_microgen_full17_pcm_mux.py tests/test_microgen_full17_pixel_acceptance.py tests/test_microgen_section25_completion_cli.py tests/test_microgen_section25_distribution_qa.py tests/test_microgen_audio_cue_binding.py tests/test_microgen_corrected_cue_realign.py tests/test_microgen_corrected_audio_stage.py tests/test_microgen_section25_real_recovery.py tests/test_microgen_corrected_shadow_video.py tests/test_microgen_corrected_slide_clock.py tests/test_microgen_corrected_slide_pixel_audit.py tests/test_microgen_corrected_listening_packet.py tests/test_microgen_corrected_release_gate.py tests/test_microgen_resumable_corrected_asr.py tests/test_microgen_local_vosk_model_verify.py tests/test_microgen_corrected_word_video.py tests/test_microgen_corrected_word_pixel_qa.py tests/test_microgen_corrected_semantic_review.py tests/test_microgen_corrected_release_gate_v2.py tests/test_microgen_final_evidence_gate.py tests/test_microgen_independent_review_packet.py tests/test_microgen_figure_pixel_evidence.py tests/test_microgen_acoustic_math_anchors.py tests/test_microgen_figure_geometry_inventory.py tests/test_microgen_equation_geometry.py tests/test_microgen_shadow_audio_diagnostics.py tests/test_microgen_shadow_pcm.py tests/test_microgen_correction_selection.py tests/test_microgen_legacy_defect_map.py
